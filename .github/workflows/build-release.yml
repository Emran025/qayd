name: Qayd Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: qayd-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.1"
  JAVA_VERSION: "17"

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: qayd-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --no-pub --reporter expanded

  build:
    name: Build and verify signed Android artifacts
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 50
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      aab_name: ${{ steps.version.outputs.aab_name }}
      debug_info_name: ${{ steps.version.outputs.debug_info_name }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4

      - name: Validate release tag and derive Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            echo 'Expected v1.2.3 or v1.2.3+45.' >&2
            exit 1
          fi

          version="${tag#v}"
          if [[ "$version" == *'+'* ]]; then
            build_name="${version%%+*}"
            build_number="${version##*+}"
          else
            build_name="$version"
            build_number="$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid Android versionCode: $build_number" >&2
            exit 1
          fi
          build_number=$((10#$build_number))
          if (( build_number < 1 || build_number > 2100000000 )); then
            echo "Invalid Android versionCode: $build_number" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "apk_name=qayd-${tag}.apk" >> "$GITHUB_OUTPUT"
          echo "aab_name=qayd-${tag}.aab" >> "$GITHUB_OUTPUT"
          echo "debug_info_name=qayd-debug-info-${tag}.zip" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: qayd-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate production configuration
        shell: bash
        env:
          QAYD_API_URL: ${{ secrets.QAYD_API_URL }}
          QAYD_ANDROID_APPLICATION_ID: ${{ vars.QAYD_ANDROID_APPLICATION_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
        run: |
          set -euo pipefail
          : "${QAYD_API_URL:?Missing QAYD_API_URL repository secret}"
          : "${QAYD_ANDROID_APPLICATION_ID:?Missing QAYD_ANDROID_APPLICATION_ID repository variable}"
          if [[ ! "$QAYD_API_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo 'QAYD_API_URL must be a valid HTTPS URL.' >&2
            exit 1
          fi
          if [[ ! "$QAYD_ANDROID_APPLICATION_ID" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || [[ "$QAYD_ANDROID_APPLICATION_ID" == "com.example.qayd" ]]; then
            echo 'Set a final, unique QAYD_ANDROID_APPLICATION_ID; do not release com.example.qayd.' >&2
            exit 1
          fi
          case "${SENTRY_ENABLED:-false}" in
            true|false) ;;
            *) echo 'SENTRY_ENABLED must be true or false.' >&2; exit 1 ;;
          esac
          if [[ "${SENTRY_ENABLED:-false}" == "true" && -z "${SENTRY_DSN:-}" ]]; then
            echo 'SENTRY_ENABLED=true requires the SENTRY_DSN secret.' >&2
            exit 1
          fi

      - name: Materialize and verify Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/qayd-release.jks
          chmod 600 android/keystore/qayd-release.jks
          test -s android/keystore/qayd-release.jks
          keytool -list -keystore android/keystore/qayd-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storeFile=keystore/qayd-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          chmod 600 android/key.properties

      - name: Build signed APK and Play-ready AAB
        shell: bash
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          AAB_NAME: ${{ steps.version.outputs.aab_name }}
          DEBUG_INFO_NAME: ${{ steps.version.outputs.debug_info_name }}
          QAYD_API_URL: ${{ secrets.QAYD_API_URL }}
          QAYD_ANDROID_APPLICATION_ID: ${{ vars.QAYD_ANDROID_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_qaydApplicationId: ${{ vars.QAYD_ANDROID_APPLICATION_ID }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENV: ${{ vars.SENTRY_ENV }}
          SENTRY_RELEASE: ${{ vars.SENTRY_RELEASE }}
          SENTRY_DIST: ${{ vars.SENTRY_DIST }}
          SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
        run: |
          set -euo pipefail
          common_args=(
            --release
            --build-name="$BUILD_NAME"
            --build-number="$BUILD_NUMBER"
            --obfuscate
            "--dart-define=QAYD_API_URL=${QAYD_API_URL}"
            "--dart-define=REVERB_APP_KEY=${REVERB_APP_KEY:-}"
            "--dart-define=SENTRY_DSN=${SENTRY_DSN:-}"
            "--dart-define=SENTRY_ENV=${SENTRY_ENV:-production}"
            "--dart-define=SENTRY_RELEASE=${SENTRY_RELEASE:-$BUILD_NAME}"
            "--dart-define=SENTRY_DIST=${SENTRY_DIST:-$BUILD_NUMBER}"
            "--dart-define=SENTRY_ENABLED=${SENTRY_ENABLED:-false}"
          )

          flutter build apk "${common_args[@]}" \
            --split-debug-info="debug-info/apk"
          flutter build appbundle "${common_args[@]}" \
            --split-debug-info="debug-info/appbundle"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          cp build/app/outputs/flutter-apk/app-release.apk dist/qayd.apk
          cp build/app/outputs/bundle/release/app-release.aab "dist/$AAB_NAME"
          test -s "dist/$APK_NAME"
          test -s dist/qayd.apk
          test -s "dist/$AAB_NAME"

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk" ]]; then
            echo 'Android SDK path is not set on the release runner.' >&2
            exit 1
          fi
          apksigner="$(find "$android_sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "$android_sdk/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          [[ -x "$apksigner" && -x "$aapt" ]] || { echo 'Android build tools are missing apksigner or aapt.' >&2; exit 1; }
          "$apksigner" verify --verbose --print-certs "dist/$APK_NAME" > dist/signing-certificate.txt
          "$aapt" dump badging "dist/$APK_NAME" | grep -Fq \
            "package: name='$QAYD_ANDROID_APPLICATION_ID' versionCode='$BUILD_NUMBER' versionName='$BUILD_NAME'"
          jarsigner -verify "dist/$AAB_NAME" >/dev/null

          test -d debug-info
          zip -qr "dist/$DEBUG_INFO_NAME" debug-info
          (cd dist && sha256sum "$APK_NAME" qayd.apk "$AAB_NAME" "$DEBUG_INFO_NAME" signing-certificate.txt > SHA256SUMS)
          test -s dist/SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: qayd-release-assets-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Retain raw debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: qayd-debug-info-${{ steps.version.outputs.tag }}
          path: debug-info/
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties && rm -rf android/keystore

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: qayd-release-assets-${{ needs.build.outputs.tag }}
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Qayd ${{ needs.build.outputs.build_name }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## قيد — الإصدار ${{ needs.build.outputs.build_name }}

            اجتاز الإصدار التحليل والاختبارات، وبُني APK وAAB موقّعان بعد التحقق من هوية الحزمة ورقم الإصدار.

            - `${{ needs.build.outputs.apk_name }}`: APK مرتبط بهذا الإصدار.
            - `qayd.apk`: APK بالاسم الثابت لأحدث إصدار.
            - `${{ needs.build.outputs.aab_name }}`: Android App Bundle للتوزيع عبر المتجر.
            - `${{ needs.build.outputs.debug_info_name }}`: رموز فك التعتيم اللازمة لتحليل الأعطال.
            - `SHA256SUMS`: بصمات SHA-256 لملفات الإصدار.

            Build: `${{ needs.build.outputs.build_name }}+${{ needs.build.outputs.build_number }}`
            Tag: `${{ needs.build.outputs.tag }}`
          files: |
            dist/${{ needs.build.outputs.apk_name }}
            dist/qayd.apk
            dist/${{ needs.build.outputs.aab_name }}
            dist/${{ needs.build.outputs.debug_info_name }}
            dist/signing-certificate.txt
            dist/SHA256SUMS
