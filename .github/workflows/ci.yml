name: Qayd Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: qayd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: qayd-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --no-pub --reporter expanded
