name: Shorebird — Qayd Single App

# A single Qayd app is updated here. Dart-only changes become OTA patches;
# native/dependency/asset changes require a new Shorebird release.
on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'assets/**'
      - 'shorebird.yaml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a native Shorebird release instead of a patch'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: shorebird-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.47.1'

jobs:
  detect-changes:
    name: Classify Flutter and native changes
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.classify.outputs.native_changed }}
      configured: ${{ steps.classify.outputs.configured }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        shell: bash
        env:
          FORCE_RELEASE: ${{ inputs.force_release }}
          EVENT_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f shorebird.yaml ]] || grep -q 'REPLACE_WITH_QAYD_SHOREBIRD_APP_ID' shorebird.yaml; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

          if [[ "$FORCE_RELEASE" == 'true' ]]; then
            echo 'native_changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="$EVENT_BEFORE"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE='HEAD^'
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE" "$SHA")"
          printf '%s\n' "$CHANGED_FILES"
          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(android/|assets/|pubspec\.yaml$|pubspec\.lock$|shorebird\.yaml$)'; then
            echo 'native_changed=true' >> "$GITHUB_OUTPUT"
            echo 'Native/dependency/asset change detected; a full release is required.'
          else
            echo 'native_changed=false' >> "$GITHUB_OUTPUT"
            echo 'Dart-only change detected; an OTA patch is eligible.'
          fi

  configuration-not-ready:
    name: Shorebird configuration status
    needs: detect-changes
    if: needs.detect-changes.outputs.configured == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Explain required one-time setup
        run: |
          echo 'Shorebird jobs are intentionally skipped until shorebird.yaml contains the real Qayd app_id.'
          echo 'Create it with shorebird init --display-name "Qayd" on an authenticated machine, then commit the generated app_id.'

  shorebird-patch:
    name: Publish Dart OTA patch
    needs: detect-changes
    if: needs.detect-changes.outputs.native_changed == 'false' && needs.detect-changes.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Validate Shorebird app configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f shorebird.yaml
          if grep -q 'REPLACE_WITH_QAYD_SHOREBIRD_APP_ID' shorebird.yaml; then
            echo 'Replace the Shorebird app_id placeholder before enabling CI.' >&2
            exit 1
          fi

      - name: Materialize Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/qayd-release.jks
          chmod 600 android/keystore/qayd-release.jks
          cat > android/key.properties <<EOF
          storeFile=keystore/qayd-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          chmod 600 android/key.properties

      - name: Publish OTA patch to stable
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          QAYD_API_URL: ${{ secrets.QAYD_API_URL }}
          QAYD_ANDROID_APPLICATION_ID: ${{ vars.QAYD_ANDROID_APPLICATION_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
        run: |
          set -euo pipefail
          : "${SHOREBIRD_TOKEN:?Missing SHOREBIRD_TOKEN}"
          : "${QAYD_API_URL:?Missing QAYD_API_URL}"
          : "${QAYD_ANDROID_APPLICATION_ID:?Missing QAYD_ANDROID_APPLICATION_ID}"
          if [[ ! "$QAYD_API_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo 'QAYD_API_URL must be a valid HTTPS URL.' >&2
            exit 1
          fi
          if [[ ! "$QAYD_ANDROID_APPLICATION_ID" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || [[ "$QAYD_ANDROID_APPLICATION_ID" == 'com.example.qayd' ]]; then
            echo 'Set a final, unique QAYD_ANDROID_APPLICATION_ID before enabling Shorebird.' >&2
            exit 1
          fi
          if [[ "${SENTRY_ENABLED:-false}" == 'true' && -z "${SENTRY_DSN:-}" ]]; then
            echo 'SENTRY_ENABLED=true requires the SENTRY_DSN secret.' >&2
            exit 1
          fi
          shorebird patch android \
            --release-version latest \
            --track stable \
            --no-confirm \
            -- \
            --dart-define="QAYD_API_URL=${QAYD_API_URL}" \
            --dart-define="SENTRY_DSN=${SENTRY_DSN:-}" \
            --dart-define='SENTRY_ENV=production' \
            --dart-define="SENTRY_RELEASE=${GITHUB_SHA}" \
            --dart-define="SENTRY_DIST=${GITHUB_RUN_NUMBER}" \
            --dart-define="SENTRY_ENABLED=${SENTRY_ENABLED:-false}" \
            -- -PqaydApplicationId="$QAYD_ANDROID_APPLICATION_ID"

  shorebird-release:
    name: Publish native Shorebird release
    needs: detect-changes
    if: needs.detect-changes.outputs.native_changed == 'true' && needs.detect-changes.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Validate Shorebird app configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f shorebird.yaml
          if grep -q 'REPLACE_WITH_QAYD_SHOREBIRD_APP_ID' shorebird.yaml; then
            echo 'Replace the Shorebird app_id placeholder before enabling CI.' >&2
            exit 1
          fi

      - name: Materialize Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/qayd-release.jks
          chmod 600 android/keystore/qayd-release.jks
          cat > android/key.properties <<EOF
          storeFile=keystore/qayd-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          chmod 600 android/key.properties

      - name: Publish native release to Shorebird
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          QAYD_API_URL: ${{ secrets.QAYD_API_URL }}
          QAYD_ANDROID_APPLICATION_ID: ${{ vars.QAYD_ANDROID_APPLICATION_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
        run: |
          set -euo pipefail
          : "${SHOREBIRD_TOKEN:?Missing SHOREBIRD_TOKEN}"
          : "${QAYD_API_URL:?Missing QAYD_API_URL}"
          : "${QAYD_ANDROID_APPLICATION_ID:?Missing QAYD_ANDROID_APPLICATION_ID}"
          if [[ ! "$QAYD_API_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo 'QAYD_API_URL must be a valid HTTPS URL.' >&2
            exit 1
          fi
          if [[ ! "$QAYD_ANDROID_APPLICATION_ID" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || [[ "$QAYD_ANDROID_APPLICATION_ID" == 'com.example.qayd' ]]; then
            echo 'Set a final, unique QAYD_ANDROID_APPLICATION_ID before enabling Shorebird.' >&2
            exit 1
          fi
          if [[ "${SENTRY_ENABLED:-false}" == 'true' && -z "${SENTRY_DSN:-}" ]]; then
            echo 'SENTRY_ENABLED=true requires the SENTRY_DSN secret.' >&2
            exit 1
          fi
          shorebird release android \
            --artifact apk \
            --flutter-version="${FLUTTER_VERSION}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --no-confirm \
            -- \
            --dart-define="QAYD_API_URL=${QAYD_API_URL}" \
            --dart-define="SENTRY_DSN=${SENTRY_DSN:-}" \
            --dart-define='SENTRY_ENV=production' \
            --dart-define="SENTRY_RELEASE=${GITHUB_SHA}" \
            --dart-define="SENTRY_DIST=${GITHUB_RUN_NUMBER}" \
            --dart-define="SENTRY_ENABLED=${SENTRY_ENABLED:-false}" \
            -- -PqaydApplicationId="$QAYD_ANDROID_APPLICATION_ID"
